schema_version: ppu-serving/v1
ppu:
  framework: sglang
  visibility: candidate
model:
  model_id: MiniMax-M3.1-Flash
light_performance_cases:
- id: minimax_m3_1_flash_w8a8_int8_tp_prefill
  ppu:
    assets:
      model: MODEL_PATH_W8A8_INT8
      tokenizer: MODEL_PATH_W8A8_INT8
    topology:
      kind: single_node
      nodes: 1
      parallelism: TP (tp8)
    platform: 810E (btv1.1)
  model:
    base_args:
    - --trust-remote-code
    - --dtype
    - bfloat16
    - --tp-size
    - '8'
    - --attention-backend
    - fa3
    - --moe-runner-backend
    - deep_gemm
    - --page-size
    - '128'
    - --mem-fraction-static
    - '0.7'
    - --tokenizer-worker-num
    - '8'
    - --quantization
    - w8a8_int8
    - --cuda-graph-backend-prefill
    - disabled
    - --disable-radix-cache
    base_env:
      SGLANG_SAIL_DEEPGEMM_MOE_TP_FUSED: '1'
      SYNC_TOKEN_IDS_ACROSS_TP: '1'
      SGLANG_WARMUP_TIMEOUT: '3600'
  variants:
    default:
      precision: w8a8-int8
  benchmark:
    engine: sglang.benchmark.one_batch
    workload: prefill
    input:
      batch_size: 1
      input_len:
      - 4096
      - 16384
      - 65536
      - 102400
      output_len: 1
    run_name: minimax_m3_1_flash_w8a8_int8_tp_prefill
  source: minimax-m3.1-flash-cases.md:159
