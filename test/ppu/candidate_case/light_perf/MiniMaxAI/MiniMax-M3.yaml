- id: minimax_m3_bf16_tp_prefill
  ppu:
    assets:
      model: MODEL_PATH_BF16
      tokenizer: MODEL_PATH_BF16
    topology:
      kind: single_node
      nodes: 1
    platform: 810E (btv1.1)
  model:
    base_args:
    - --trust-remote-code
    - --tp-size
    - '16'
    - --mem-fraction-static
    - '0.7'
    - --attention-backend
    - fa3
    - --moe-runner-backend
    - deep_gemm
    - --cuda-graph-backend-prefill
    - disabled
    - --disable-radix-cache
    base_env: {}
  variants:
    default:
      precision: bf16
  benchmark:
    engine: sglang.benchmark.one_batch
    workload: prefill
    input:
      batch_size: 1
      input_len:
      - 4096
      - 16384
      - 65536
      - 102400
      output_len: 1
    run_name: minimax_m3_bf16_tp_prefill
  source: minimax-m3-cases.md:234
