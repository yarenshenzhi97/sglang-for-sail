schema_version: ppu-serving/v1
ppu:
  framework: sglang
  visibility: candidate
model:
  model_id: DeepSeek-V4.1-Flash
light_performance_cases:
- id: dpsk_v4_1_flash_w8a8_int8_tp_prefill
  ppu:
    assets:
      model: MODEL_PATH_W8A8_INT8
      tokenizer: MODEL_PATH_W8A8_INT8
    topology:
      kind: single_node
      nodes: 1
    platform: 810E (btv1.1)
  model:
    base_args:
    - --trust-remote-code
    - --tp-size
    - '16'
    - --mem-fraction-static
    - '0.7'
    - --disable-radix-cache
    - --disable-cuda-graph
    - --cuda-graph-max-bs-decode
    - '64'
    - --chunked-prefill-size
    - '19968'
    - --enable-prefill-cp
    - --cp-strategy
    - interleave
    - --disable-shared-experts-fusion
    - --disable-custom-all-reduce
    - --page-size
    - '64'
    - --quantization
    - w8a8_int8
    base_env: {}
  variants:
    default:
      precision: w8a8-int8
  benchmark:
    engine: sglang.benchmark.one_batch
    workload: prefill
    input:
      batch_size: 1
      input_len:
      - 4096
      - 16384
      - 65536
      - 102400
      output_len: 1
    run_name: dpsk_v4_1_flash_w8a8_int8_tp_prefill
  source: dpsk-v4.1-flash-cases.md:171
