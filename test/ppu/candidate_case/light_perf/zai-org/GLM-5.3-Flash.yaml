- id: glm_5_3_flash_bf16_tp_prefill
  ppu:
    assets:
      model: MODEL_PATH_BF16
      tokenizer: MODEL_PATH_BF16
    topology:
      kind: single_node
      nodes: 1
    platform: 810E (btv1.1)
  model:
    base_args:
    - --trust-remote-code
    - --tp-size
    - '16'
    - --attention-backend
    - dsa
    - --dsa-prefill-backend
    - flashmla_sparse
    - --dsa-decode-backend
    - flashmla_sparse
    - --enable-prefill-cp
    - --cp-strategy
    - interleave
    - --attn-cp-size
    - '16'
    - --disable-radix-cache
    - --disable-cuda-graph
    - --mem-fraction-static
    - '0.75'
    - --disable-shared-experts-fusion
    - --disable-custom-all-reduce
    base_env: {}
  variants:
    default:
      precision: bf16
  benchmark:
    engine: sglang.benchmark.one_batch
    workload: prefill
    input:
      batch_size: 1
      input_len:
      - 4096
      - 16384
      - 65536
      - 102400
      output_len: 1
    run_name: glm_5_3_flash_bf16_tp_prefill
  source: glm-5.3-flash-cases.md:416
